    }

      display: flex;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
    .table-panel {

      min-width: 400px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }
    .table-header {
      padding: 10px 15px;

      font-weight: 600;
      border-bottom: 1px solid #ddd;
    }
    .table-content {
      max-height: 500px;
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #eee;
      padding: 6px 8px;
      text-align: left;
    }
    th {
      background-color: #f9f9f9;
    }

      color: #d32f2f;
      font-style: italic;
    }
    .success {

    }
    .info-box {
      background: #e3f2fd;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;

  <div class="info-box">

  <label for="seeds">Seed Keywords (one per line)</label>

  <label for="language">Language (hl)</label>
  <select id="language"></select>

  <label for="country">Country/Region (gl)</label>
  <select id="country"></select>

  <label>Custom Prefixes (one per line)</label>
  <textarea id="customPrefixes" placeholder="best&#10;top"></textarea>

  <label>Custom Suffixes (one per line)</label>
  <textarea id="customSuffixes" placeholder="tools&#10;meaning"></textarea>

  <div class="checkbox-group">
    <label><input type="checkbox" id="includeAlphabet" checked> Include English + selected language alphabet</label>
    <label><input type="checkbox" id="latinOnlyOverride"> Use selected language only (exclude English)</label>
    <label><input type="checkbox" id="includeSpace"> Space variants</label>
    <label><input type="checkbox" id="semanticFilter"> Use Semantic Relevance Filter</label>
  </div>

  <button id="startBtn">Generate & Fetch All</button>
  <div class="status" id="status"></div>

      { code: 'YE', name: 'Yemen' }, { code: 'ZM', name: 'Zambia' }, { code: 'ZW', name: 'Zimbabwe' }
    ];

    // Populate dropdowns
    const langSelect = document.getElementById('language');
    const countrySelect = document.getElementById('country');

    LANGUAGES.forEach(lang => {
      const opt = document.createElement('option');
      opt.value = lang.code;
      opt.textContent = `${lang.name} (${lang.code})`;
      langSelect.appendChild(opt);
    });

    COUNTRIES.forEach(country => {
      const opt = document.createElement('option');
      opt.value = country.code;
      opt.textContent = `${country.name} (${country.code})`;
      countrySelect.appendChild(opt);
    });

    langSelect.value = 'en';
    countrySelect.value = 'US';

    // ====== ALPHABETS ======
    function getAlphabetForLanguage(hl, excludeEnglish = false) {
      const english = 'abcdefghijklmnopqrstuvwxyz';
      if (excludeEnglish && hl === 'en') return english;

      const native = {
        bn: 'অআইউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহড়ঢ়য়ৎ',
        hi: 'अआइईउऊएऐओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह',
        mr: 'अआइईउऊऋएऐओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह',
        ne: 'अआइईउऊऋएऐओऔकखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह',
        ar: 'ابتجحدخذرزسشصضطظعغفقكلمنهويآةى',
        fa: 'ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی',
        ur: 'ابپتثجچحخدذرڑزژسشصضطظعغفقکگلمنوہھیے',
        ru: 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',
        uk: 'абвгґдеєжзиіїйклмнопрстуфхцчшщьюя',
        bg: 'абвгдежзийклмнопрстуфхцчшщъьюя',
        el: 'αβγδεζηθικλμνξοπρστυφχψω',
        he: 'אבגדהוזחטיכלמנסעפצקרשת',
        ta: 'அஆஇஉஊஎஏஐஒஓஔகஙசஜஞடணதநனபமயரறலளழவஷஸஹ',
        te: 'అఆఇఈఉఊఋఎఏఐఒఓఔకఖగఙచఛజఝఞటఠడఢణతథదధనపఫబభమయరఱలళవశషసహ',
        kn: 'ಅಆಇಈಉಊಋಎಏಐಒಓಔಕಖಗಘಙಚಛಜಝಞಟಠಡಢಣತಥದಧನಪಫಬಭಮಯರಲವಶಷಸಹ',
        ml: 'അആഇഈഉഊഋഎഏഐഒഓഔകഖഗഘങചഛജഝഞടഠഡഢണതഥദധനപഫബഭമയരറലവശഷസഹ',
        ja: 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ',
        ko: '가나다라마바사아자차카타파하거너더러머버서어저처커터퍼허고노도로모보소오조초코토포호',
        th: 'กขฃคฅฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ',
        vi: 'aăâbcdđeêghiklmnoôơpqrstuưvxy'
      };

      if (excludeEnglish) {
        return native[hl] || english;
      }
      return english + (native[hl] || '');
    }

    // ====== FETCH VIA PROXY ======
    async function fetchSuggestions(query, hl, gl) {
      const proxyUrl = `/api/proxy?q=${encodeURIComponent(query)}&hl=${hl}&gl=${gl}`;
      try {
        const response = await fetch(proxyUrl);
        const text = await response.text();
        const callback = text.match(/jQuery\d+_\d+/)?.[0];
        if (!callback) return [];
        const match = text.match(new RegExp(`${callback}\\((.*)\\)`));
        if (!match) return [];
        const data = JSON.parse(match[1]);
        return (data[1] || []).map(item => 
          item[0].replace(/\\u003c/g, '<').replace(/\\u003e/g, '>').replace(/<\/?b>/g, '')
        );
      } catch (e) {
        console.warn(`Fetch failed for "${query}"`, e.message);
        return [];
      }
    }

    // ====== GENERATE VARIANTS FOR MULTIPLE SEEDS ======
    function generateKeywordVariants(seeds, hl) {
      const allVariants = [];
      
      for (const seed of seeds) {
        const v = [{ query: seed, prefix: '', suffix: '', seed: seed }];
        
        if (document.getElementById('includeSpace').checked) {
          v.push({ query: ` ${seed}`, prefix: '(space)', suffix: '', seed: seed });
          v.push({ query: `${seed} `, prefix: '', suffix: '(space)', seed: seed });
        }
        
        if (document.getElementById('includeAlphabet').checked) {
          const exclude = document.getElementById('latinOnlyOverride').checked;
          const chars = getAlphabetForLanguage(hl, exclude);
          for (const char of chars) {
            v.push({ query: `${char} ${seed}`, prefix: char, suffix: '', seed: seed });
            v.push({ query: `${seed} ${char}`, prefix: '', suffix: char, seed: seed });
          }
        }
        
        ['customPrefixes', 'customSuffixes'].forEach((id, isSuffix) => {
          document.getElementById(id).value.split('\n').map(s => s.trim()).filter(s => s)
            .forEach(term => {
              v.push({
                query: isSuffix ? `${seed} ${term}` : `${term} ${seed}`,
                prefix: isSuffix ? '' : term,
                suffix: isSuffix ? term : '',
                seed: seed
              });
            });
        });
        
        allVariants.push(...v);
      }
      
      return allVariants;
    }

    // ====== UTILITIES ======
    function renderTable(container, rows) {
      if (rows.length === 0) {
        container.innerHTML = '<div style="padding:15px;color:#888;">No data</div>';
        return;
      }
      const html = `<table><thead><tr><th>seed</th><th>prefix</th><th>suffix</th><th>query</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r[0] || '&nbsp;'}</td><td>${r[1] || '&nbsp;'}</td><td>${r[2] || '&nbsp;'}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>`;
      container.innerHTML = html;
    }

    function copyToClipboard(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-999999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    function cosineSimilarity(a, b) {
      let dot = 0, normA = 0, normB = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        normA += a[i] * a[i];
        normB += b[i] * b[i];
      }
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    // ====== MAIN LOGIC ======
    document.getElementById('startBtn').addEventListener('click', async () => {
      const seedsText = document.getElementById('seeds').value.trim();
      const hl = document.getElementById('language').value;
      const gl = document.getElementById('country').value;
      const useSemantic = document.getElementById('semanticFilter').checked;

      const seeds = seedsText.split('\n').map(s => s.trim()).filter(s => s);
      
      if (seeds.length === 0) return alert('Enter at least one seed keyword');

      const btn = document.getElementById('startBtn');
      const status = document.getElementById('status');
      const rawEl = document.getElementById('rawResults');
      const filteredEl = document.getElementById('filteredResults');
      const copyRaw = document.getElementById('copyRawBtn');
      const copyFiltered = document.getElementById('copyBtn');

      btn.disabled = true;
      status.textContent = `Generating variants for ${seeds.length} seed(s)...`;
      rawEl.innerHTML = '<div style="padding:15px;">Loading...</div>';
      filteredEl.innerHTML = '<div style="padding:15px;">Loading...</div>';
      copyRaw.style.display = 'none';
      copyFiltered.style.display = 'none';

      const variants = generateKeywordVariants(seeds, hl);
      status.textContent = `Fetching ${variants.length} queries from ${seeds.length} seed(s)...`;

      const allRaw = [['seed','prefix','suffix','query']];
      let completed = 0;
      
      for (let i = 0; i < variants.length; i++) {
        const { query, prefix, suffix, seed } = variants[i];
        const suggestions = await fetchSuggestions(query, hl, gl);
        suggestions.forEach(s => allRaw.push([seed, prefix, suffix, s]));
        completed++;
        
        if (completed % 10 === 0 || completed === variants.length) {
          status.textContent = `Progress: ${completed}/${variants.length} queries completed (${Math.round(completed/variants.length*100)}%)`;
        }
        
        await new Promise(r => setTimeout(r, 300));
      }

      const seen = new Set();
      const uniqueRaw = allRaw.filter(row => !seen.has(row[3]) && seen.add(row[3]));

      renderTable(rawEl, uniqueRaw.slice(1));
      const rawTsv = uniqueRaw.map(r => r.map(f => `"${String(f).replace(/"/g,'""')}"`).join('\t')).join('\n');
      copyRaw.onclick = () => {
        copyToClipboard(rawTsv);
        const t = copyRaw.textContent;
        copyRaw.textContent = '✅ Copied!';
        setTimeout(() => copyRaw.textContent = t, 2000);
      };
      copyRaw.style.display = 'inline-block';

      if (useSemantic) {
        status.textContent = 'Loading AI model (~45MB)...';
        const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
        const encoder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
        status.textContent = 'Filtering by meaning...';

        // Use first seed as reference for semantic filtering
        const seedEmb = (await encoder(seeds[0])).data;
        const filtered = [['seed','prefix','suffix','query']];
        
        for (const row of uniqueRaw.slice(1)) {
          const emb = (await encoder(row[3])).data;
          const sim = cosineSimilarity(Array.from(seedEmb), Array.from(emb));
          if (sim > 0.60) filtered.push(row);
        }

        renderTable(filteredEl, filtered.slice(1));
        const tsv = filtered.map(r => r.map(f => `"${String(f).replace(/"/g,'""')}"`).join('\t')).join('\n');
        copyFiltered.onclick = () => {
          copyToClipboard(tsv);
          const t = copyFiltered.textContent;
          copyFiltered.textContent = '✅ Copied!';
          setTimeout(() => copyFiltered.textContent = t, 2000);
        };
        copyFiltered.style.display = 'inline-block';
        status.textContent = `✅ Done! Seeds: ${seeds.length} | Raw: ${uniqueRaw.length-1} | Filtered: ${filtered.length-1}`;
        status.className = 'status success';
      } else {
        filteredEl.innerHTML = '<div style="padding:15px;color:#888;">Enable AI filter to see relevant results</div>';
        status.textContent = `✅ Done! Processed ${seeds.length} seed(s). Total: ${uniqueRaw.length-1} suggestions`;
        status.className = 'status success';
      }

      btn.disabled = false;
    });
  </script>
